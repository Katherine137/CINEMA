<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <title>CINE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="page">
        <section class="hero"><h1><i class="fa-solid fa-film"></i>  CINEMA</h1></section>
        <div class="toolbar">
            <div id="statusText">Cargando...</div>
            <button class="button primary" onclick="document.getElementById('formContainer').style.display = document.getElementById('formContainer').style.display === 'none' ? 'block' : 'none'"> Agregar</button>
        </div>
        <div id="formContainer" style="display:none;">
            <form id="movieForm">
                <input name="titulo" placeholder="Título" required />
                <input name="director" placeholder="Director" required />
                <input name="anio" type="number" placeholder="Año" required />
                <select id="genero" name="genero" required>
                    <option value="">Género</option>
                    <option value="Acción">Acción</option>
                    <option value="Comedia">Comedia</option>
                    <option value="Drama">Drama</option>
                    <option value="Terror">Terror</option>
                    <option value="Aventura">Aventura</option>
                    <option value="Ciencia ficción">Ciencia ficción</option>
                    <option value="Romance">Romance</option>
                    <option value="Fantasía">Fantasía</option>
                </select>
                <input name="url_imagen" placeholder="URL Imagen" />
                <label class="file-label">
                    <span id="videoLabel" class="file-btn">📎 Seleccionar video</span>
                    <input id="url_video" name="url_video" type="file" accept="video/*" style="display:none;"
                        onchange="document.getElementById('videoLabel').textContent = this.files[0] ? '✅ Video seleccionado' : '📎 Seleccionar video'" />
                </label>
                <button type="submit" class="button primary">Guardar</button>
            </form>
        </div>
        <div id="tableWrapper" class="movie-grid"></div>
    </div>
    <div id="videoModal" class="modal-video"><button class="btn-cerrar" onclick="closeVideo()">Cerrar</button><div id="videoContainer"></div></div>
    <div id="editModal" class="modal-edit">
        <form id="editForm" class="modal-edit-form">
            <h3>Editar</h3>
            <input type="hidden" id="editId" />
            <input id="editTitulo" name="titulo" required />
            <input id="editDirector" name="director" required />
            <input id="editAnio" name="anio" type="number" required />
            <select id="editGenero" name="genero" required>
                <option value="">Género</option>
                <option value="Acción">Acción</option>
                <option value="Comedia">Comedia</option>
                <option value="Drama">Drama</option>
                <option value="Terror">Terror</option>
                <option value="Aventura">Aventura</option>
                <option value="Ciencia ficción">Ciencia ficción</option>
                <option value="Romance">Romance</option>
                <option value="Fantasía">Fantasía</option>
            </select>
            <input id="editImagen" name="url_imagen" placeholder="URL Imagen" />
            <label class="file-label-edit">
                <span id="editVideoLabel" class="file-btn">📎 Cambiar video</span>
                <input id="editVideo" name="url_video" type="file" accept="video/*" style="display:none;"
                    onchange="document.getElementById('editVideoLabel').textContent = '📎 Video listo'" />
            </label>
            <div class="modal-edit-buttons">
                <button type="submit" class="button primary">Guardar</button>
                <button type="button" class="button" onclick="document.getElementById('editModal').style.display='none'">Cancelar</button>
            </div>
        </form>
    </div>
    <div id="detailModal" class="modal-edit">
        <div class="modal-detail-form">
            <h3 id="detailTitulo"></h3>
            <p><strong>Director:</strong> <span id="detailDirector"></span></p>
            <p><strong>Año:</strong> <span id="detailAnio"></span></p>
            <p><strong>Género:</strong> <span id="detailGenero"></span></p>
            <img id="detailImagen" />
            <div class="modal-edit-buttons">
                <button class="button" onclick="document.getElementById('detailModal').style.display='none'">Cerrar</button>
            </div>
        </div>
    </div>
    <div id="deleteModal" class="modal-edit">
        <div class="modal-delete-form">
            <p class="delete-modal-text">Esta acción no se puede deshacer.</p>
            <div class="modal-edit-buttons">
                <button class="button" onclick="document.getElementById('deleteModal').style.display='none'">Cancelar</button>
                <button class="button primary" id="confirmDeleteBtn">Eliminar</button>
            </div>
        </div>
    </div>
    <script>
        const apiBase = '/api/peliculas';
        async function showDetail(id) {
            const res = await fetch(apiBase);
            const movies = await res.json();
            const m = movies.find(x => x.id === id);
            document.getElementById('detailTitulo').textContent = m.titulo;
            document.getElementById('detailDirector').textContent = m.director;
            document.getElementById('detailAnio').textContent = m.anio;
            document.getElementById('detailGenero').textContent = m.genero;
            const img = document.getElementById('detailImagen');
            img.src = m.url_imagen || 'https://via.placeholder.com/200x300';
            img.style.display = m.url_imagen ? 'block' : 'none';
            document.getElementById('detailModal').style.display = 'flex';
        }
        function closeVideo() {
            document.getElementById('videoContainer').innerHTML = '';
            document.getElementById('videoModal').style.display = 'none';
        }
        async function renderMovies() {
            document.getElementById('statusText').textContent = 'Cargando...';
            try {
                const res = await fetch(apiBase);
                const movies = await res.json();
                document.getElementById('statusText').textContent = movies.length + ' película(s)';
                document.getElementById('tableWrapper').innerHTML = movies.map(m => `
                    <div class="movie-card">
                        <img src="${m.url_imagen || 'https://via.placeholder.com/200x300'}" onclick="showVideo('${m.url_video || ''}')">
                        <div class="menu-trigger" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block'">⋮</div>
                        <div class="movie-menu">
                            <button onclick="editMovie(${m.id})"><i class="fa-regular fa-pen-to-square"></i> Editar</button>
                            <button onclick="showDetail(${m.id})"><i class="bi bi-ticket-detailed"></i> Detalle</button>
                            <button onclick="deleteMovie(${m.id})"><i class="bi bi-trash3"></i> Eliminar</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('statusText').textContent = 'Error al conectar con el servidor';
                document.getElementById('tableWrapper').innerHTML = '<p style="color:red; padding:20px;">No se pudo cargar las películas. Verifica que el servidor esté corriendo.</p>';
            }
        }
        function showVideo(url) {
            if (!url) { alert('Esta película no tiene video disponible.'); return; }
            const modal = document.getElementById('videoModal');
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';

            const video = document.createElement('video');
            video.width = 320;
            video.height = 570;
            video.controls = true;
            video.autoplay = true;
            video.style.borderRadius = '10px';

            const ext = url.split('.').pop().toLowerCase();
            const mimeTypes = { mp4: 'video/mp4', webm: 'video/webm', ogg: 'video/ogg', mov: 'video/quicktime', mkv: 'video/x-matroska' };
            const source = document.createElement('source');
            source.src = url;
            source.type = mimeTypes[ext] || 'video/mp4';

            video.appendChild(source);
            video.load();
            video.onerror = () => {
                container.innerHTML = `<p style="color:white;text-align:center;padding:20px;">❌ No se pudo reproducir el video.<br><small>${url}</small></p>`;
            };
            container.appendChild(video);
            modal.style.display = 'flex';
        }

        let pendingDeleteId = null;

        function deleteMovie(id) {
            pendingDeleteId = id;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        document.getElementById('confirmDeleteBtn').onclick = async () => {
            if (!pendingDeleteId) return;
            await fetch(apiBase + '/' + pendingDeleteId, { method: 'DELETE' });
            document.getElementById('deleteModal').style.display = 'none';
            pendingDeleteId = null;
            renderMovies();
        };

        async function editMovie(id) {
            const res = await fetch(apiBase);
            const movies = await res.json();
            const m = movies.find(x => x.id === id);
            document.getElementById('editId').value = m.id;
            document.getElementById('editTitulo').value = m.titulo;
            document.getElementById('editDirector').value = m.director;
            document.getElementById('editAnio').value = m.anio;
            document.getElementById('editGenero').value = m.genero;
            document.getElementById('editImagen').value = m.url_imagen || '';
            document.getElementById('editModal').style.display = 'flex';
        }
        
        document.getElementById('movieForm').onsubmit = async (e) => {
            e.preventDefault();
            await fetch(apiBase, { method: 'POST', body: new FormData(e.target) });
            e.target.reset();
            renderMovies();
        };
        document.getElementById('editForm').onsubmit = async (e) => {
            e.preventDefault();
            await fetch(`${apiBase}/${document.getElementById('editId').value}`, { method: 'PUT', body: new FormData(e.target) });
            document.getElementById('editModal').style.display = 'none';
            renderMovies();
        };
        renderMovies();
    </script>
</body>
</html>
